<div class="dialog-backdrop" (click)="cancelled.emit()"><section class="edit-dialog card border-0 shadow-lg" role="dialog" aria-modal="true" aria-labelledby="days-title" (click)="$event.stopPropagation()">
  <button type="button" class="close-dialog" aria-label="Close" (click)="cancelled.emit()"><i class="bi bi-x-lg"></i></button><span class="dialog-icon"><i class="bi bi-calendar2-week"></i></span><p class="dialog-kicker">A WEEK THAT WORKS</p><h2 id="days-title">Days of service</h2><p class="dialog-intro">Choose the days your doors are open. The rest become your days off.</p>
  <div class="day-list">@for(day of weekdays; track day){<button type="button" class="day-option" [class.selected]="isSelected(day)" [attr.aria-pressed]="isSelected(day)" (click)="toggle(day)"><span class="day-check"><i class="bi" [class.bi-check2]="isSelected(day)"></i></span><span>{{day}}</span><span class="day-state">{{isSelected(day)?'Open':'Day off'}}</span></button>}</div>
  <div class="schedule-preview"><i class="bi bi-sun me-2"></i>{{selected().length}} days open <span>·</span> {{7-selected().length}} days off</div>
  <div class="dialog-actions"><button class="btn btn-light" type="button" (click)="cancelled.emit()">Cancel</button><button class="btn btn-success" type="button" [disabled]="selected().length === 0" (click)="submit()">Continue <i class="bi bi-arrow-right ms-1"></i></button></div>
</section></div>
