<div class="dialog-backdrop" (click)="cancelled.emit()">
  <section
    class="edit-dialog card border-0 shadow-lg"
    role="dialog"
    aria-modal="true"
    aria-labelledby="hours-title"
    (click)="$event.stopPropagation()">
    <button type="button" class="close-dialog" aria-label="Close" (click)="cancelled.emit()">
      <i class="bi bi-x-lg"></i></button
    ><span class="dialog-icon"><i class="bi bi-clock-history"></i></span>
    <p class="dialog-kicker">YOUR DAILY RHYTHM</p>
    <h2 id="hours-title">Opening hours</h2>
    <p class="dialog-intro">Set the hours guests can drop by for a good meal.</p>
    <div class="hours-grid">
      <label class="form-label"
        >Doors open<input
          class="form-control"
          type="time"
          [ngModel]="timeOpen()"
          (ngModelChange)="timeOpen.set($event)" /></label
      ><span class="hours-divider"><i class="bi bi-arrow-right"></i></span
      ><label class="form-label"
        >Last service<input
          class="form-control"
          type="time"
          [ngModel]="timeClose()"
          (ngModelChange)="timeClose.set($event)"
      /></label>
    </div>
    <div class="hours-note">
      <i class="bi bi-info-circle me-2"></i>These hours apply to every active day in your schedule.
    </div>
    <div class="dialog-actions">
      <button class="btn btn-light" type="button" (click)="cancelled.emit()">Cancel</button
      ><button
        class="btn btn-success"
        type="button"
        [disabled]="!timeOpen() || !timeClose() || timeOpen() >= timeClose()"
        (click)="requested.emit({ timeOpen: timeOpen(), timeClose: timeClose() })">
        Continue <i class="bi bi-arrow-right ms-1"></i>
      </button>
    </div>
  </section>
</div>
